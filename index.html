<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>شهادة الإنجاز | RED HAT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #12345a 0, #071426 55%, #030914 100%);
    }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 2rem); text-align: center; }
    .hint { margin: 0; color: #c5d4e5; text-align: center; }
    .certificate {
      width: min(100%, 1100px); height: auto; display: block;
      border-radius: 12px; box-shadow: 0 18px 55px #0009;
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a {
      display: inline-block; padding: 12px 22px; border-radius: 9px;
      color: #071426; background: #42c8f5; text-decoration: none;
      font-weight: 700;
    }
    a.secondary { color: #fff; background: #183454; border: 1px solid #3c658c; }
  </style>
</head>
<body>
  <h1>شهادة الإنجاز – RED HAT</h1>
  <p class="hint">شاهدي الشهادة واحفظي نسخة منها على جهازك</p>
  <img class="certificate" src="certificate.jpg" alt="شهادة إنجاز RED HAT">
  <div class="actions">
    <a href="certificate.jpg" download="RED-HAT-Certificate.jpg">تحميل الشهادة</a>
    <a class="secondary" href="certificate.jpg" target="_blank" rel="noopener">فتح الصورة بالحجم الكامل</a>
  </div>
</body>
</html>
